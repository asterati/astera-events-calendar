name: Atualizar calendário (Zoom)

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 06:00 BRT (09:00 UTC)
  workflow_dispatch: {} # permite rodar na hora pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rodar o sync do Zoom
        env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
        run: node sync-zoom.mjs

      - name: Commitar se o data.json mudou
        run: |
          if [ -n "$(git status --porcelain src/data.json)" ]; then
            git config user.name "astera-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/data.json
            git commit -m "chore: atualiza calendário (Zoom)"
            git push
          else
            echo "Sem mudanças no data.json."
          fi
